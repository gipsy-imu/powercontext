services:
  lunar-customs:
    build:
      context: ${DIFY_LUNAR_DIR:?Set DIFY_LUNAR_DIR to the absolute path of the submission dify directory}
    restart: unless-stopped
    networks:
      - ssrf_proxy_network
    volumes:
      - lunar_customs_data:/data

  ssrf_proxy:
    volumes:
      - ${DIFY_LUNAR_DIR:?Set DIFY_LUNAR_DIR}/lunar-customs.squid.conf:/etc/squid/conf.d/10-lunar-customs.conf:ro

volumes:
  lunar_customs_data:
